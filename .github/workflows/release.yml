name: Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Step 1: Map the secret presence to an environment variable
    # This allows us to use it in 'if' conditions below.
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore from Secrets
        # Use env.HAS_KEYSTORE instead of secrets.RELEASE_KEYSTORE_BASE64
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "Using persistent keystore from secrets..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Check for Release Keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "ERROR: RELEASE_KEYSTORE_BASE64 secret not found."
          echo "Release builds require a valid keystore and credentials."
          exit 1

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate random release name
        id: release_name
        run: |
          ADJECTIVES=(Swift Bright Cosmic Noble Stellar Amber Vivid Crimson Azure Bold Radiant Serene)
          NOUNS=(Falcon Horizon Phoenix Comet Orbit Aurora Nebula Summit Beacon Spark Zenith Tide)
          ADJ=${ADJECTIVES[$RANDOM % ${#ADJECTIVES[@]}]}
          NOUN=${NOUNS[$RANDOM % ${#NOUNS[@]}]}
          echo "name=${ADJ} ${NOUN}" >> $GITHUB_OUTPUT

      - name: Get version info
        id: version
        run: |
          # Extract version info from Gradle task output
          VERSION_INFO=$(./gradlew -q printVersionInfo)
          VERSION_NAME=$(echo "$VERSION_INFO" | grep "VERSION_NAME=" | cut -d'=' -f2)
          VERSION_CODE=$(echo "$VERSION_INFO" | grep "VERSION_CODE=" | cut -d'=' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Rename APK files
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AttendanceTracker-v${{ steps.version.outputs.version_name }}-release.apk || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## What's new in v${{ steps.version.outputs.version_name }}"
            echo
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            LOG=$(git log "$RANGE" --no-merges --pretty='- %s')
            echo "${LOG:-- Maintenance release, no user-facing changes.}"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$PREV...v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}"
            fi
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}
          name: ${{ steps.release_name.outputs.name }} (v${{ steps.version.outputs.version_name }})
          body_path: release-notes.md
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (keep latest 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[10:][].tagName' | while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
